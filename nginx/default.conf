# Upstream - point to our Django service
# Используем именованный upstream вместо hardcode в proxy_pass
upstream django_backend {
    server web:8000;
}

# Map для WebSocket upgrade
# Нужен для корректной обработки WebSocket handshake
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Main server block
server {
    # Слушаем на порту 80
    listen 80;
    
    # Server name для localhost
    server_name localhost 127.0.0.1;
    
    # Увеличиваем максимальный размер тела запроса до 25MB
    # Нужно для загрузки аватарок и медиа файлов
    client_max_body_size 25M;
    
    # Charset
    charset utf-8;
    
    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    
    # Static files - обслуживаются nginx напрямую
    
    location /static/ {
        alias /var/www/static/;
        
        # Долгоживущий кеш для статики (30 дней)
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # Отключаем логи для статики (опционально)
        access_log off;
    }
    
    
    # Media files - обслуживаются nginx напрямую
   
    location /media/ {
        alias /var/www/media/;
        
        # Средний кеш для медиа (7 дней)
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    
    
    # WebSocket location - для live комментариев
    
    location /ws/ {
        # Проксируем на Django upstream
        proxy_pass http://django_backend;
        
        # WebSocket требует HTTP/1.1
        proxy_http_version 1.1;
        
        # Критически важные заголовки для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Стандартные proxy заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Расширенный таймаут для WebSocket (держим соединение открытым)
        # WebSocket может быть idle долгое время
        proxy_read_timeout 3600s;  # 1 час
        proxy_send_timeout 3600s;  # 1 час
        
        # Отключаем буферизацию для real-time коммуникации
        proxy_buffering off;
    }
    
    
    # Catch-all location - всё остальное на Django
    
    location / {
        # Проксируем на Django upstream
        proxy_pass http://django_backend;
        
        # Передаём оригинальный Host заголовок
        # Django проверяет его через ALLOWED_HOSTS
        proxy_set_header Host $host;
        
        # IP адрес клиента
        # Используется для логирования и rate limiting
        proxy_set_header X-Real-IP $remote_addr;
        
        # Цепочка прокси
        # Стандартный заголовок для отслеживания всех прокси в цепи
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Протокол оригинального запроса (http/https)
        # Нужно если потом добавим HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Стандартные настройки прокси
        proxy_redirect off;
        proxy_buffering off;
    }
}
